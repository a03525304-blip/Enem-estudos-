<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102c52">
<meta name="description" content="Plataforma de estudos para o ENEM: matérias, exercícios, redação e orientação.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>ENEM 2026 — Guia de Estudos</title>
<style>
:root{--navy:#102c52;--blue:#174f78;--teal:#237b91;--bg:#f3f6fa;--card:#fff;--ink:#18283a;--muted:#64748b;--line:#dce4ed;--soft:#edf3f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:900px;margin:auto;padding:16px}.hero{background:linear-gradient(145deg,var(--navy),var(--blue) 65%,var(--teal));color:#fff;border-radius:20px;padding:25px;margin-bottom:15px}.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.12em;opacity:.8}.hero h1{font-size:2.2rem;line-height:1.1;margin:12px 0}.muted{color:var(--muted)}.hero .muted{color:#e0edf7}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 14px;background:#fff;color:var(--ink);font-weight:650}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.full{width:100%}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 10px;position:sticky;top:0;background:var(--bg);z-index:3}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:.85rem}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.subject{width:100%;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--ink)}.subject strong{display:block;margin:5px 0}.topic{padding:12px;background:var(--soft);border:1px solid var(--line);border-radius:11px;margin:9px 0}.choice{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.choice.good{background:#e2f6e9;border-color:#31945b}.choice.bad{background:#fde8e8;border-color:#c45b5b}.small{font-size:.85rem}.hide{display:none!important}.footer{text-align:center;color:var(--muted);font-size:.78rem;padding:20px}.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:#3189a5}.chatlog{min-height:170px;max-height:360px;overflow:auto;background:var(--soft);padding:12px;border-radius:12px}.bubble{padding:10px 12px;border-radius:12px;margin:7px 0;max-width:92%;white-space:pre-wrap}.bot{background:#fff;border:1px solid var(--line)}.user{background:#dcecf7;margin-left:auto}.notice{background:#fff8df;border:1px solid #ead89a;border-radius:12px;padding:12px;font-size:.9rem}
@media(min-width:650px){.wrap{padding:24px}.hero h1{font-size:2.8rem}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
 <div class="eyebrow">SUA JORNADA COMEÇA AQUI</div>
 <h1>ENEM 2026</h1>
 <p class="muted">Aprenda no seu ritmo. Pratique. Prepare seu futuro.</p>
 <div id="welcome" class="small"></div>
</header>
<section id="login" class="card">
 <h2>Entrar na área de estudos</h2>
 <p class="muted small">Digite seu nome. Este acesso é local e demonstrativo; não cria uma conta online.</p>
 <input id="studentName" class="field" maxlength="45" placeholder="Seu nome">
 <button id="enterBtn" class="btn primary full" style="margin-top:10px">Entrar nos estudos →</button>
</section>
<section id="app" class="hide">
 <nav class="tabs" aria-label="Menu principal">
  <button class="tab active" data-tab="inicio">Início</button>
  <button class="tab" data-tab="materias">Matérias</button>
  <button class="tab" data-tab="questoes">Questões</button>
  <button class="tab" data-tab="enem">Sobre o ENEM</button>
  <button class="tab" data-tab="redacao">Redação</button>
  <button class="tab" data-tab="professor">Professor</button>
  <button class="tab" data-tab="perfil">Meu espaço</button>
 </nav>
 <main id="view" aria-live="polite"></main>
</section>
<div class="footer">ENEM 2026 • Guia independente de estudos • Confira sempre os editais oficiais.</div>
</div>
<script>
const subjects=[
["Língua Portuguesa","Interpretação, gêneros textuais, gramática em contexto, coesão, semântica, argumentação e variação linguística.","📖"],
["Literatura","Quinhentismo, Barroco, Arcadismo, Romantismo, Realismo, Naturalismo, Parnasianismo, Simbolismo, Modernismo e literatura contemporânea.","📚"],
["Inglês","Leitura e interpretação, ideia central, finalidade, vocabulário pelo contexto, conectivos, pronomes e gêneros digitais.","🇬🇧"],
["Espanhol","Compreensão textual, vocabulário, falsos cognatos, conectores, gêneros textuais e aspectos culturais.","🇪🇸"],
["Artes","Artes visuais, música, teatro, dança, cinema, arte urbana, patrimônio e movimentos artísticos.","🎨"],
["Educação Física","Esportes, jogos, lutas, danças, práticas corporais, saúde, inclusão e padrões de corpo.","🏃"],
["História Geral","Antiguidade, Idade Média, Renascimento, Reforma, Iluminismo, revoluções, imperialismo, guerras mundiais e Guerra Fria.","🏛️"],
["História do Brasil","Colonização, escravidão, economia colonial, Independência, Império, República, Era Vargas, ditadura, redemocratização e movimentos sociais.","🇧🇷"],
["Geografia","Clima, relevo, vegetação, hidrografia, biomas, população, migrações, urbanização, indústria, agropecuária e globalização.","🌎"],
["Filosofia","Ética, política, conhecimento, lógica, filosofia antiga, moderna e contemporânea; Sócrates, Platão, Aristóteles e outros pensadores.","💭"],
["Sociologia","Cultura, socialização, trabalho, classes sociais, desigualdade, cidadania, Estado, poder, movimentos sociais e diversidade.","👥"],
["Biologia","Ecologia, cadeias alimentares, ciclos, genética, evolução, citologia, fisiologia humana, botânica, microbiologia e saúde.","🧬"],
["Química","Estrutura atômica, tabela periódica, ligações, estequiometria, soluções, termoquímica, cinética, equilíbrio, química orgânica e ambiente.","⚗️"],
["Física","Mecânica, movimento, forças, energia, calor, termologia, ondas, óptica, eletricidade, magnetismo e circuitos.","⚡"],
["Matemática","Aritmética, frações, porcentagem, razão, proporção, regra de três, álgebra, equações, funções e sequências.","📐"],
["Geometria","Geometria plana, espacial e analítica; áreas, perímetros, volumes, semelhança, escalas e trigonometria básica.","📏"],
["Estatística e Probabilidade","Média, moda, mediana, gráficos, tabelas, análise de dados, probabilidade e análise combinatória.","📊"],
["Redação","Texto dissertativo-argumentativo, tese, repertório, argumentação, coesão, proposta de intervenção e competências avaliadas.","✍️"],
["Atualidades e temas sociais","Meio ambiente, mudanças climáticas, tecnologia, inteligência artificial, saúde, educação, cidadania e direitos humanos.","📰"],
["Interdisciplinaridade","Leitura de situações-problema que conectam Ciências Humanas, Natureza, Linguagens e Matemática.","🔎"]
];
const questions=[
{a:"Matemática",q:"Um produto custa R$ 200 e recebe desconto de 15%. Qual é o preço final?",o:["R$ 160","R$ 170","R$ 175","R$ 185"],c:1,e:"15% de 200 = 30. Então, 200 − 30 = R$ 170."},
{a:"Biologia",q:"Qual processo permite que plantas usem luz para produzir matéria orgânica?",o:["Fermentação","Respiração","Fotossíntese","Digestão"],c:2,e:"Na fotossíntese, a energia luminosa é usada para produzir matéria orgânica a partir de água e gás carbônico."},
{a:"História",q:"A Revolução Industrial começou primeiro em qual país?",o:["França","Inglaterra","Brasil","Portugal"],c:1,e:"A Inglaterra foi pioneira na industrialização, a partir do século XVIII."},
{a:"Geografia",q:"O aumento da concentração de gases de efeito estufa contribui para:",o:["A intensificação do aquecimento global","A interrupção das marés","A parada da rotação terrestre","O fim das estações"],c:0,e:"Gases de efeito estufa retêm parte da energia térmica na atmosfera, intensificando o aquecimento."},
{a:"Química",q:"Uma solução com pH menor que 7 é considerada:",o:["Básica","Neutra","Ácida","Metálica"],c:2,e:"Na escala usual, pH abaixo de 7 indica acidez."},
{a:"Física",q:"Qual unidade mede a potência elétrica?",o:["Volt","Watt","Ohm","Ampere"],c:1,e:"A potência elétrica é medida em watts (W)."},
{a:"Português",q:"Em uma charge, a ironia costuma ser usada para:",o:["Apresentar uma fórmula","Criticar ou provocar reflexão","Listar referências","Descrever uma paisagem"],c:1,e:"A ironia cria contraste entre o sentido literal e a intenção, muitas vezes crítica."},
{a:"Sociologia",q:"Socialização é o processo pelo qual uma pessoa:",o:["Aprende normas e valores sociais","Deixa de conviver em sociedade","Nasce sabendo todas as regras","Evita a cultura"],c:0,e:"A socialização envolve aprender valores, comportamentos e normas de convivência."},
{a:"Filosofia",q:"Qual pensador é tradicionalmente associado à frase “Só sei que nada sei”?",o:["Platão","Sócrates","Descartes","Aristóteles"],c:1,e:"A frase é tradicionalmente associada a Sócrates e à consciência dos limites do próprio conhecimento."},
{a:"Literatura",q:"A Semana de Arte Moderna de 1922 é um marco do:",o:["Arcadismo","Barroco","Modernismo","Romantismo"],c:2,e:"A Semana de 1922 é um marco simbólico do Modernismo brasileiro."},
{a:"Estatística",q:"Qual é a média de 4, 6 e 8?",o:["5","6","7","8"],c:1,e:"(4 + 6 + 8) ÷ 3 = 18 ÷ 3 = 6."},
{a:"Redação",q:"Uma proposta de intervenção na redação deve:",o:["Repetir o tema","Apresentar ação relacionada ao problema","Fazer pergunta sem resposta","Ignorar o problema"],c:1,e:"A proposta deve apresentar uma ação viável e relacionada ao problema, detalhando elementos como agente, ação, meio e finalidade."},
{a:"Física",q:"Se a velocidade de um objeto aumenta em um intervalo de tempo, ele apresenta:",o:["Aceleração positiva no sentido adotado","Massa nula","Temperatura zero","Ausência de movimento"],c:0,e:"A aceleração descreve a variação da velocidade ao longo do tempo. O sinal depende do sentido escolhido."},
{a:"Química",q:"A água (H₂O) é formada por:",o:["Dois átomos de hidrogênio e um de oxigênio","Dois átomos de oxigênio e um de hidrogênio","Um átomo de cada elemento","Três átomos de oxigênio"],c:0,e:"A fórmula H₂O indica dois átomos de hidrogênio e um de oxigênio."},
{a:"Geografia",q:"O deslocamento de pessoas do campo para a cidade é chamado de:",o:["Êxodo rural","Imigração sazonal","Transumância marítima","Turismo"],c:0,e:"Êxodo rural é a migração da população de áreas rurais para áreas urbanas."},
{a:"Português",q:"A função principal de um artigo de opinião é:",o:["Defender um ponto de vista","Ensinar uma receita","Registrar dados pessoais","Narrar uma lenda"],c:0,e:"O artigo de opinião apresenta uma tese e argumentos para defender um ponto de vista."},
{a:"Biologia",q:"Qual molécula armazena a maior parte da informação genética dos seres vivos?",o:["Glicose","DNA","Água","Amido"],c:1,e:"O DNA armazena a informação genética na maioria dos seres vivos."},
{a:"Matemática",q:"Se 3 cadernos custam R$ 24, quanto custam 5 cadernos pelo mesmo preço unitário?",o:["R$ 30","R$ 36","R$ 40","R$ 45"],c:2,e:"Cada caderno custa 24 ÷ 3 = 8 reais. Cinco custam 5 × 8 = R$ 40."},
{a:"História",q:"A abolição legal da escravidão no Brasil ocorreu em:",o:["1822","1888","1889","1930"],c:1,e:"A Lei Áurea foi assinada em 13 de maio de 1888. A abolição não eliminou as desigualdades sociais."},
{a:"Artes",q:"O patrimônio cultural imaterial inclui:",o:["Somente edifícios","Saberes, festas e tradições","Apenas pinturas em museus","Somente monumentos de pedra"],c:1,e:"Patrimônio imaterial inclui práticas, expressões, conhecimentos e celebrações transmitidos entre gerações."}
];
const $=id=>document.getElementById(id);let name=localStorage.getItem("enemName")||"",tab="inicio",qi=0,chosen=null,checked=false,answered=0,correct=0;let reviewed=JSON.parse(localStorage.getItem("enemReviewed")||"[]");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function enter(){let n=$("studentName").value.trim();if(!n){$("studentName").focus();return;}name=n;localStorage.setItem("enemName",name);$("login").classList.add("hide");$("app").classList.remove("hide");$("welcome").textContent="Bem-vindo(a), "+name+"!";render();}
$("enterBtn").addEventListener("click",enter);$("studentName").addEventListener("keydown",e=>{if(e.key==="Enter")enter();});
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));render();}));
function card(t,d,icon="📘"){return `<article class="card"><b>${icon} ${t}</b><p class="muted small">${d}</p></article>`;}
function render(){let v=$("view");if(tab==="inicio"){v.innerHTML=`<section class="card"><h2>Olá, ${esc(name)}! 👋</h2><p class="muted">Escolha uma área e comece sua preparação.</p><div class="grid"><div class="topic"><b>${reviewed.length}/20</b><div class="small muted">Matérias abertas</div></div><div class="topic"><b>${answered}</b><div class="small muted">Questões respondidas nesta sessão</div></div></div></section>${card("Estude por áreas","Explore os conteúdos de Linguagens, Humanas, Natureza e Matemática.","📚")}${card("Pratique questões","Responda exercícios e leia as explicações.","✏️")}${card("Conheça as oportunidades","Entenda SISU, ProUni, FIES e outras possibilidades.","🎓")}<button class="btn primary full" data-goto="materias">Explorar matérias →</button>`;}
if(tab==="materias"){v.innerHTML=`<h2>Matérias e conteúdos</h2><p class="muted small">Toque em uma matéria para abrir um roteiro de estudo.</p><div class="grid">${subjects.map((s,i)=>`<button class="subject" data-sub="${i}"><span>${s[2]}</span><strong>${s[0]}</strong><span class="small muted">${s[1]}</span><div class="small" style="margin-top:8px">${reviewed.includes(i)?"✓ Aberta":"Ver roteiro →"}</div></button>`).join("")}</div><div id="lesson"></div>`;}
if(tab==="questoes"){let q=questions[qi];v.innerHTML=`<section class="card"><div class="small muted">QUESTÃO ${qi+1} DE ${questions.length} • ${q.a}</div><h3>${q.q}</h3><div id="opts">${q.o.map((o,i)=>`<button class="choice" data-opt="${i}">${"ABCD"[i]}) ${o}</button>`).join("")}</div><div id="feedback" class="small" style="margin-top:12px"></div><button id="check" class="btn primary full" style="margin-top:12px">Verificar resposta</button><button id="next" class="btn full hide" style="margin-top:8px">Próxima questão →</button></section>`;}
if(tab==="enem"){v.innerHTML=`<section class="card"><div class="eyebrow" style="color:var(--blue)">ENTENDA O EXAME</div><h2>O que é o ENEM?</h2><p>O Exame Nacional do Ensino Médio é uma avaliação brasileira criada em 1998. Atualmente, é uma das principais formas de acesso à educação superior no país.</p></section>${card("Como é organizado?","A aplicação regular ocorre em dois dias. A prova reúne Linguagens, Ciências Humanas, Ciências da Natureza, Matemática e uma redação.","📝")}${card("SISU","Sistema de seleção para vagas em instituições públicas participantes.","🏛️")}${card("ProUni","Oferece bolsas integrais ou parciais em instituições privadas, conforme os requisitos e regras do programa.","🎓")}${card("FIES","Programa de financiamento estudantil para cursos superiores privados, sujeito às regras vigentes.","📖")}${card("Estudar em Portugal","Algumas instituições portuguesas conveniadas aceitam resultados do ENEM em seus processos seletivos.","🌍")}${card("Desenvolvimento pessoal","A preparação ajuda a desenvolver leitura crítica, raciocínio, escrita, organização e autonomia.","🌱")}${card("Acessibilidade","Há possibilidade de solicitar atendimento especializado e recursos de acessibilidade, conforme regras e prazos da edição.","🤝")}<div class="notice">A participação no ENEM não garante vaga, bolsa ou financiamento. Cada programa tem requisitos, seleção, prazos e editais próprios.</div><p class="small"><a href="https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem" target="_blank" rel="noopener">Portal oficial do ENEM no Inep ↗</a></p>`;}
if(tab==="redacao"){v.innerHTML=`<section class="card"><h2>Oficina de redação</h2><p class="muted small">Treine a estrutura do texto dissertativo-argumentativo.</p><div class="topic"><b>1. Introdução</b><p class="small muted">Apresente o tema, contextualize e indique sua tese.</p></div><div class="topic"><b>2. Desenvolvimento</b><p class="small muted">Construa argumentos, explique causas e consequências e use repertório pertinente.</p></div><div class="topic"><b>3. Conclusão</b><p class="small muted">Apresente uma proposta de intervenção relacionada ao problema, respeitando os direitos humanos.</p></div><div class="topic"><b>As cinco competências</b><p class="small muted">Domínio da escrita formal; compreensão do tema; organização dos argumentos; coesão; proposta de intervenção.</p></div><label for="essay"><b>Área de rascunho</b></label><textarea id="essay" class="field" rows="8" placeholder="Escreva seu rascunho aqui..."></textarea><p class="small muted">O rascunho fica salvo neste navegador.</p><button id="saveEssay" class="btn primary">Salvar rascunho</button><span id="essayStatus" class="small muted"></span></section><section class="card"><b>Temas para praticar</b><ul><li>Desafios para combater a desinformação no Brasil.</li><li>Obstáculos à inclusão de pessoas com deficiência.</li><li>Impactos do descarte inadequado de resíduos.</li><li>Uso responsável da inteligência artificial na educação.</li></ul></section>`;let essay=localStorage.getItem("enemEssay")||"";$("essay").value=essay;}
if(tab==="professor"){v.innerHTML=`<section class="card"><h2>Professor virtual 📚</h2><p class="muted small">Faça uma pergunta sobre os assuntos do ENEM. Esta versão oferece orientações locais e exemplos; ainda não está conectada a uma inteligência artificial online.</p><div class="chatlog" id="chatlog"><div class="bubble bot">Olá, ${esc(name)}! Sou seu assistente de estudos demonstrativo. Pergunte sobre matemática, redação, biologia, história, física, química ou como funciona o ENEM.</div></div><form id="chatForm" style="display:flex;gap:8px;margin-top:10px"><input id="chatInput" class="field" placeholder="Digite sua dúvida..." required><button class="btn primary">Enviar</button></form><p class="small muted">Para responder qualquer pergunta com explicações geradas por IA, será necessário conectar um serviço de IA com segurança, sem expor chaves secretas no site.</p></section>`;}
if(tab==="perfil"){v.innerHTML=`<section class="card"><h2>Meu espaço</h2><p>Estudante: <b>${esc(name)}</b></p><p class="muted small">${reviewed.length} de 20 roteiros de matérias abertos.</p><div class="bar"><span style="width:${reviewed.length/20*100}%"></span></div><p class="small muted">Seu nome, rascunho e matérias abertas são guardados neste navegador. Isso não é uma conta sincronizada.</p><button id="clearProgress" class="btn">Limpar matérias abertas</button><button id="exit" class="btn" style="margin-left:6px">Sair</button></section>`;}}
$("view").addEventListener("click",e=>{let go=e.target.closest("[data-goto]");if(go){tab=go.dataset.goto;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));render();return;}let sub=e.target.closest("[data-sub]");if(sub){let i=+sub.dataset.sub,s=subjects[i];if(!reviewed.includes(i)){reviewed.push(i);localStorage.setItem("enemReviewed",JSON.stringify(reviewed));}let lesson=$("lesson");lesson.innerHTML=`<section class="card"><h3>${s[2]} ${s[0]}</h3><p>${s[1]}</p><b>Roteiro de estudo</b><ol><li>Revise os conceitos fundamentais.</li><li>Faça um resumo com suas palavras.</li><li>Resolva questões anteriores relacionadas ao tema.</li><li>Analise os erros e revise novamente.</li></ol><p class="small muted">Roteiro marcado como aberto no seu progresso.</p></section>`;return;}let opt=e.target.closest("[data-opt]");if(opt&&!checked){chosen=+opt.dataset.opt;document.querySelectorAll("[data-opt]").forEach(x=>x.style.outline=(x===opt?"2px solid #3189a5":"none"));return;}if(e.target.id==="check"){if(chosen===null){$("feedback").textContent="Escolha uma alternativa primeiro.";return;}checked=true;answered++;let q=questions[qi];if(chosen===q.c)correct++;document.querySelectorAll("[data-opt]").forEach((x,i)=>{x.disabled=true;if(i===q.c)x.classList.add("good");else if(i===chosen)x.classList.add("bad");});$("feedback").innerHTML=(chosen===q.c?"<b>Correto!</b> ":"<b>Vamos aprender:</b> ")+q.e;$("check").classList.add("hide");$("next").classList.remove("hide");return;}if(e.target.id==="next"){qi=(qi+1)%questions.length;chosen=null;checked=false;render();return;}if(e.target.id==="saveEssay"){localStorage.setItem("enemEssay",$("essay").value);$("essayStatus").textContent=" • Rascunho salvo.";return;}if(e.target.id==="clearProgress"){reviewed=[];localStorage.setItem("enemReviewed","[]");render();return;}if(e.target.id==="exit"){localStorage.removeItem("enemName");location.reload();}});
$("view").addEventListener("submit",e=>{if(e.target.id!=="chatForm")return;e.preventDefault();let input=$("chatInput"),q=input.value.trim();if(!q)return;let log=$("chatlog");let u=document.createElement("div");u.className="bubble user";u.textContent=q;log.appendChild(u);let ans=answerTeacher(q);let b=document.createElement("div");b.className="bubble bot";b.textContent=ans;log.appendChild(b);input.value="";log.scrollTop=log.scrollHeight;});
function answerTeacher(q){let x=q.toLowerCase();if(/fotossíntese|biologia|planta/.test(x))return "Fotossíntese é o processo em que plantas, algas e algumas bactérias usam energia luminosa para produzir matéria orgânica. Nas plantas, água e gás carbônico participam do processo, e há liberação de oxigênio. Dica ENEM: relacione o tema a energia, cadeias alimentares e ciclo do carbono.";if(/porcent|matem|desconto/.test(x))return "Porcentagem significa uma parte de 100. Exemplo: 15% de 200 = 0,15 × 200 = 30. Se for desconto, subtraia: 200 − 30 = 170. Tente sempre identificar se a questão pede o valor do percentual ou o preço final.";if(/redação|redacao|texto|tese/.test(x))return "Uma redação dissertativo-argumentativa apresenta uma tese, desenvolve argumentos e conclui com uma proposta de intervenção. Organize em introdução, dois parágrafos de desenvolvimento e conclusão. A proposta deve respeitar os direitos humanos.";if(/enem|sisu|prouni|fies/.test(x))return "O ENEM é uma avaliação nacional que também pode ser usada em seleções para o ensino superior. SISU seleciona para vagas públicas; ProUni oferece bolsas em instituições privadas; FIES é financiamento. Cada programa possui regras e editais próprios.";if(/fot|energia|física|fisica/.test(x))return "Na Física, identifique primeiro os dados, a unidade e o que a questão pede. Em movimento, por exemplo, velocidade média é distância dividida pelo tempo. Depois confira se as unidades são compatíveis.";if(/história|historia/.test(x))return "Para estudar História, organize os acontecimentos em contexto, causas, agentes e consequências. Compare processos históricos e observe como eles se relacionam com cidadania, trabalho e desigualdade.";return "Posso ajudar com um roteiro inicial: identifique o conceito principal, procure um exemplo do cotidiano e depois resolva uma questão. Nesta versão offline minhas respostas são limitadas a alguns temas. Para tirar dúvidas abertas com um professor de IA, precisaremos conectar um serviço de inteligência artificial.";}
if(name){$("studentName").value=name;enter();}
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
